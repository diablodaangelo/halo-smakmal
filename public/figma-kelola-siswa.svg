      <!-- Nav Item 1 (Active) -->
      <g id="Nav-Kelola-Siswa" transform="translate(0, 24)">
        <rect width="228" height="42" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
        <circle cx="24" cy="21" r="7" fill="#059669" opacity="0.15" />
        <!-- Lucide Users Icon Vector -->
        <path d="M19 25 a3.5 3.5 0 1 0 0 -7 a3.5 3.5 0 0 0 0 7 z M27 25 a2.5 2.5 0 1 0 0 -5 a2.5 2.5 0 0 0 0 5 z" fill="#059669" />
        <text x="44" y="26" font-size="13" font-weight="700" fill="#047857">Kelola Siswa</text>
      </g>

      <!-- Nav Item 2 -->
      <g id="Nav-Kelola-Guru" transform="translate(0, 74)">
        <rect width="228" height="42" rx="10" fill="transparent" />
        <text x="44" y="26" font-size="13" font-weight="600" fill="#64748B">Kelola Guru</text>
      </g>

      <!-- Nav Item 3 -->
      <g id="Nav-Master-DUDI" transform="translate(0, 122)">
        <rect width="228" height="42" rx="10" fill="transparent" />
        <text x="44" y="26" font-size="13" font-weight="600" fill="#64748B">Master DUDI</text>
      </g>

      <text x="12" y="190" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="1">PENGATURAN</text>
      
      <!-- Nav Item 4 -->
      <g id="Nav-Konfigurasi" transform="translate(0, 204)">
        <rect width="228" height="42" rx="10" fill="transparent" />
        <text x="44" y="26" font-size="13" font-weight="600" fill="#64748B">Konfigurasi Sistem</text>
      </g>
    </g>

    <!-- Sidebar User Profile Footer -->
