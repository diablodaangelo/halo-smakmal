    <!-- Logo Header -->
    <g id="Sidebar-Logo" transform="translate(24, 20)">
      <rect width="40" height="40" rx="10" fill="#059669" />
      <text x="14" y="26" font-size="18" font-weight="800" fill="#FFFFFF">H</text>
      <text x="50" y="20" font-size="15" font-weight="700" fill="#0F172A">Halo SMKAmal</text>
      <text x="50" y="34" font-size="11" font-weight="600" fill="#059669">Admin Portal</text>
    </g>
    <line x1="0" y1="72" x2="260" y2="72" stroke="#F1F5F9" stroke-width="1" />

    <!-- Sidebar Menu Group -->
    <g id="Sidebar-Menu" transform="translate(16, 92)">
