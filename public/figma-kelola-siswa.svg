      <text x="70" y="14" font-size="12" font-weight="600" fill="#94A3B8">/</text>
      <rect x="85" y="-2" width="95" height="24" rx="6" fill="#ECFDF5" />
      <text x="96" y="14" font-size="12" font-weight="700" fill="#047857">Kelola Siswa</text>
    </g>

