        <text x="74" y="48" font-size="11" font-weight="500" fill="#64748B">aisyah@smkamaliah.sch.id • NIS: 212210002</text>

        <rect x="360" y="18" width="220" height="26" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
