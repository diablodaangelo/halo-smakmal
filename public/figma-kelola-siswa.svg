<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960" style="background:#F8FAFC; font-family:'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;">
  <defs>
    <!-- Shadow Filter -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- ==================== BACKGROUND ==================== -->
  <rect width="1440" height="960" fill="#F8FAFC" />

  <!-- ==================== SIDEBAR ==================== -->
