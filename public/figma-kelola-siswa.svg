        <text x="20" y="28" font-size="10" font-weight="700" fill="#64748B" letter-spacing="0.5">TOTAL SISWA PKL</text>
        <text x="20" y="60" font-size="28" font-weight="800" fill="#0F172A">128</text>
        <text x="20" y="78" font-size="11" font-weight="500" fill="#94A3B8">Siswa terdaftar aktif</text>
        
