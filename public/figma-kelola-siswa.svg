      <rect width="228" height="60" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <circle cx="30" cy="30" r="18" fill="#059669" />
      <text x="21" y="35" font-size="12" font-weight="700" fill="#FFFFFF">AD</text>
      <text x="56" y="26" font-size="12" font-weight="700" fill="#0F172A">Administrator</text>
      <text x="56" y="41" font-size="10" font-weight="500" fill="#64748B">admin@smkamaliah.sch.id</text>
    </g>
